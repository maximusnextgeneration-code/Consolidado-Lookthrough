<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consolidado Look-through — Sep 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg:#f6f7f9; --panel:#fff; --panel-2:#f0f2f5; --border:#e2e6ec; --border-strong:#cbd2db;
    --text:#0d1b2a; --text-2:#4a5568; --text-3:#6b7280; --text-4:#94a3b8;
    --green:#0a6b3b; --green-soft:#d1fae5; --green-light:#ecfdf5;
    --red:#9b1c1c; --red-soft:#fee2e2; --red-light:#fef2f2;
    --blue:#1e3a8a; --blue-soft:#dbeafe; --blue-light:#eff6ff;
    --amber:#92400e; --amber-soft:#fef3c7;
    --sidebar-bg:#0d1b2a; --sidebar-bg-2:#1b263b; --sidebar-text:#cbd5e1; --sidebar-muted:#64748b;
    --shadow-sm:0 1px 2px rgba(13,27,42,.04); --shadow-md:0 4px 12px rgba(13,27,42,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
  /* SIDEBAR */
  .sidebar{background:linear-gradient(180deg,var(--sidebar-bg),var(--sidebar-bg-2));color:var(--sidebar-text);position:sticky;top:0;height:100vh;overflow-y:auto;padding:24px 0;display:flex;flex-direction:column}
  .sb-brand{padding:0 22px 18px;border-bottom:1px solid rgba(255,255,255,.08)}
  .sb-logo{font-size:10px;letter-spacing:2.5px;color:var(--sidebar-muted);text-transform:uppercase;font-weight:600;margin-bottom:5px}
  .sb-title{font-size:19px;font-weight:800;color:#fff;letter-spacing:-.4px}
  .sb-sub{font-size:11px;color:var(--sidebar-muted);margin-top:3px}
  .modo{display:flex;gap:3px;margin:13px 0 2px;background:rgba(255,255,255,.08);padding:3px;border-radius:9px}
  .modo button{flex:1;border:0;background:transparent;color:var(--sidebar-text);font-family:inherit;
    font-size:11.5px;font-weight:700;padding:6px 4px;border-radius:7px;cursor:pointer;transition:all .15s;letter-spacing:.2px}
  .modo button:hover{color:#fff}
  .modo button.on{background:#fff;color:var(--sidebar-bg)}
  .badge-modo{font-size:11px;padding:3px 10px;border-radius:999px;font-weight:700}
  .badge-modo.actual{background:var(--blue-soft);color:var(--blue)}
  .badge-modo.sugerido{background:var(--green-soft);color:var(--green)}
  td.pos{color:var(--green);font-weight:600}td.neg{color:var(--red);font-weight:600}
  .tag.acc{font-size:10px;padding:2px 9px}
  .tag.compra{background:#d1fae5;color:#065f46}
  .tag.aumenta{background:#dbeafe;color:#1e3a8a}
  .tag.reduce{background:#fef3c7;color:#92400e}
  .tag.venta{background:#fee2e2;color:#9b1c1c}
  .tag.mantiene{background:#f1f5f9;color:#64748b}
  .sb-section{padding:16px 16px 5px;font-size:10px;letter-spacing:1.8px;color:var(--sidebar-muted);text-transform:uppercase;font-weight:700}
  .sb-item{display:flex;align-items:center;gap:10px;padding:8px 14px;margin:1px 10px;border-radius:8px;color:var(--sidebar-text);cursor:pointer;font-size:12.5px;font-weight:500;transition:all .15s}
  .sb-item:hover{background:rgba(255,255,255,.06);color:#fff}
  .sb-item.active{background:rgba(30,58,138,.45);color:#fff;font-weight:600}
  .sb-item .ico{width:17px;text-align:center;flex-shrink:0;opacity:.9;font-size:13px}
  .sb-item .count{margin-left:auto;font-size:10px;font-weight:700;background:rgba(255,255,255,.1);padding:1px 7px;border-radius:999px}
  .sb-item .cdot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .sb-foot{margin-top:auto;padding:16px 22px 0;border-top:1px solid rgba(255,255,255,.08);font-size:10.5px;color:var(--sidebar-muted);line-height:1.6}
  .sb-foot strong{color:#e2e8f0}
  /* MAIN */
  .mh{background:rgba(255,255,255,.95);border-bottom:1px solid var(--border);padding:20px 34px 18px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;position:sticky;top:0;z-index:40;backdrop-filter:blur(8px)}
  .mh-tag{font-size:10.5px;letter-spacing:2px;color:var(--text-3);text-transform:uppercase;font-weight:600}
  .mh-h1{font-size:24px;font-weight:800;letter-spacing:-.5px;margin-top:3px;display:flex;align-items:center;gap:11px;flex-wrap:wrap}
  .mh-h1 .badge{font-size:11px;padding:3px 10px;border-radius:999px;font-weight:700;background:var(--blue-soft);color:var(--blue)}
  .mh-meta{text-align:right;font-size:11.5px;color:var(--text-2);flex-shrink:0}
  .content{padding:26px 34px 70px;max-width:1500px}
  .view{display:none}.view.active{display:block}
  /* CARDS / KPI */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:22px}
  .kpi{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px 20px;box-shadow:var(--shadow-sm)}
  .kpi .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:1.2px;color:var(--text-3);font-weight:700}
  .kpi .val{font-size:23px;font-weight:800;letter-spacing:-.5px;margin-top:6px;font-variant-numeric:tabular-nums}
  .kpi .sub{font-size:11.5px;color:var(--text-3);margin-top:3px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:22px 24px;box-shadow:var(--shadow-sm);margin-bottom:18px}
  .card-title{font-size:14.5px;font-weight:700;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .card-title .meta{font-size:11px;color:var(--text-3);font-weight:500}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px}
  .grid2 > .card{margin-bottom:0}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px;margin-bottom:18px}
  .grid3 > .card{margin-bottom:0}
  @media(max-width:1200px){.grid2,.grid3{grid-template-columns:1fr}}
  .section-title{font-size:11.5px;letter-spacing:2px;color:var(--text-3);text-transform:uppercase;font-weight:700;margin:30px 0 14px;display:flex;align-items:center;gap:12px}
  .section-title::after{content:"";flex:1;height:1px;background:var(--border)}
  /* TABLES */
  table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
  th{text-align:left;padding:9px 10px;color:var(--text-3);font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border);background:#fafbfc;white-space:nowrap;position:sticky;top:0}
  th.num{text-align:right}
  td{padding:8px 10px;border-bottom:1px solid #eef0f3;vertical-align:top}
  td.num{text-align:right;white-space:nowrap}
  td.muted{color:var(--text-4)}
  tr.total td{background:var(--amber-soft);font-weight:700;border-top:2px solid var(--border-strong)}
  tr.group-row{cursor:pointer}
  tr.group-row:hover td{background:var(--blue-light)}
  tr.sub-row td{background:#fafbfc;font-size:12px;color:var(--text-2)}
  .tbl-wrap{max-height:640px;overflow:auto;border:1px solid var(--border);border-radius:8px}
  .caret{display:inline-block;width:14px;transition:transform .15s;color:var(--text-4);font-size:10px}
  .caret.open{transform:rotate(90deg)}
  .tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:700;letter-spacing:.3px;white-space:nowrap}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;flex-shrink:0}
  .bar{height:8px;border-radius:4px;background:var(--panel-2);overflow:hidden;min-width:60px}
  .bar > div{height:100%;border-radius:4px}
  .pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .pill{padding:7px 14px;border-radius:999px;border:1px solid var(--border);background:var(--panel);font-size:12px;font-weight:600;cursor:pointer;transition:all .12s}
  .pill:hover{border-color:var(--border-strong)}
  .pill.active{background:var(--sidebar-bg);color:#fff;border-color:var(--sidebar-bg)}
  .note{background:#fafbfc;border:1px solid var(--border);border-radius:8px;padding:12px 16px;font-size:11.8px;line-height:1.65;color:var(--text-2);margin-top:12px}
  .note strong{color:var(--text)}
  .note.warn{background:var(--amber-soft);border-color:#fcd34d}
  .chart-box{position:relative;height:290px}
  .chart-box.tall{height:340px}
  .chart-box.short{height:230px}
  .search{padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:12.5px;font-family:inherit;width:230px;color:var(--text)}
  .search:focus{outline:2px solid var(--blue-soft);border-color:var(--blue)}
  select.filter{padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:12px;font-family:inherit;color:var(--text);background:var(--panel);cursor:pointer}
  .filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .filters .lblf{font-size:11px;color:var(--text-3);font-weight:600}
  th.sortable{cursor:pointer;user-select:none}
  th.sortable:hover{color:var(--blue)}
  .legend{display:flex;flex-direction:column;gap:7px;font-size:12px}
  .legend .li{display:flex;align-items:center;gap:8px}
  .legend .li .nm{flex:1;color:var(--text-2)}
  .legend .li .vl{font-weight:700;font-variant-numeric:tabular-nums}
  .legend .li .pc{color:var(--text-3);width:48px;text-align:right;font-variant-numeric:tabular-nums}
  .split{display:grid;grid-template-columns:1.15fr .85fr;gap:24px;align-items:center}
  @media(max-width:900px){.split{grid-template-columns:1fr}}
  @media print{.sidebar{display:none}.app{grid-template-columns:1fr}.view{display:block!important;page-break-before:always}}
</style>
<style>
  .vizsel{display:inline-flex;gap:2px;background:#f0f2f5;padding:3px;border-radius:8px;flex-shrink:0}
  .vizsel button{border:0;background:transparent;font-family:inherit;font-size:11px;font-weight:600;color:var(--text-3);
    padding:4px 10px;border-radius:6px;cursor:pointer;transition:all .12s}
  .vizsel button:hover{color:var(--text)}
  .vizsel button.on{background:#fff;color:var(--blue);box-shadow:0 1px 2px rgba(13,27,42,.12)}
  .ighy{display:flex;height:26px;border-radius:7px;overflow:hidden;margin-top:14px}
  .ighy div{display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden}
  .scope{margin-top:12px}
  .scope label{display:block;font-size:9.5px;letter-spacing:1.6px;color:var(--sidebar-muted);text-transform:uppercase;font-weight:700;margin-bottom:5px}
  .scope select{width:100%;padding:7px 9px;border-radius:8px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.08);
    color:#fff;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer}
  .scope select option{color:#0d1b2a}
  .btn-csv{margin-left:auto;padding:7px 14px;border-radius:8px;border:1px solid var(--blue);background:var(--blue);color:#fff;
    font-family:inherit;font-size:12px;font-weight:600;cursor:pointer}
  .btn-csv:hover{opacity:.9}
  .sarr{color:var(--blue)}
  @media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{position:relative;height:auto}.content,.mh{padding-left:16px;padding-right:16px}}
</style>
</head>

      L.rvgeo.forEach((x,i)=> r.rvgeo[i] += rv*x/100); L.rvsec.forEach((x,i)=> r.rvsec[i] += rv*x/100); }
  });
  r.dur = r.rfvd ? r.durw/r.rfvd : null; r.ytw = r.rfvd ? r.ytww/r.rfvd : null;
  const rated = sum(r.rat.slice(0,7));
  r.ratNum = rated ? sum(r.rat.slice(0,7).map((x,i)=>x*(i+1)))/rated : null;
  r.ig = r.rfv ? sum(r.rat.slice(0,4))/r.rfv : null;
  r.c = k => r.cl[CL.indexOf(k)];
  r.otros = r.c('Oro / Commodities') + r.c('Otros') + r.c('Derivados');
  return r;
}
const grupos = (labels, vals, colors) => labels.map((k,i)=>({k, v:vals[i], c:colors?colors[i%colors.length]:PALETA[i%PALETA.length]}))
  .filter(g=>g.v>=1000);   // se omiten exposiciones residuales (< USD 1.000)
const ordenar = gs => gs.slice().sort((a,b)=>b.v-a.v);
let LT = lt(POS);

/* agrupador generico por instrumento */
function agrupar(items, keyFn){
  const m = new Map();
  items.forEach(p => { const k = keyFn(p);
    if(!m.has(k)) m.set(k, {k, v:0, n:0, items:[]}); const g = m.get(k); g.v += p.valor; g.n++; g.items.push(p); });
  return [...m.values()].sort((a,b)=>b.v-a.v);
}
const claveActivo = p => p.isin || p.nombre.toLowerCase().slice(0,48);

/* ============ charts ============ */
const CHARTS = {};
function donut(id, gs){
  const el = document.getElementById(id); if(!el) return; if(CHARTS[id]) CHARTS[id].destroy();
  const t = sum(gs.map(g=>g.v));
  CHARTS[id] = new Chart(el, {type:'doughnut',
    data:{labels:gs.map(g=>g.k), datasets:[{data:gs.map(g=>g.v), backgroundColor:gs.map(g=>g.c), borderWidth:2, borderColor:'#fff'}]},
    options:{responsive:true, maintainAspectRatio:false, cutout:'62%', plugins:{legend:{display:false},
      tooltip:{callbacks:{label:c=>` ${c.label}: ${fmt$(c.raw)} (${fmtP(c.raw/t)})`}}}}});
}
/* barras: el eje de categorias lleva SIEMPRE el nombre (nunca el indice); el eje de valores lleva el formato */
function ejes(horizontal, fmtVal, rotate){
  const cat = {grid:{display:false}, ticks:{font:{size:10.5}, autoSkip:false, maxRotation:rotate||0, minRotation:rotate||0,
                 callback:function(v){ const l = this.getLabelForValue(v); return l.length>34 ? l.slice(0,33)+'…' : l; }}};
  const val = {grid:{color:'#eef0f3'}, ticks:{font:{size:10.5}, callback:fmtVal}};
  return horizontal ? {x:val, y:cat} : {x:cat, y:val};
}
function barrasP(id, gs, base, opts={}){
  const el = document.getElementById(id); if(!el) return; if(CHARTS[id]) CHARTS[id].destroy();
  CHARTS[id] = new Chart(el, {type:'bar',
    data:{labels:gs.map(g=>g.k), datasets:[{data:gs.map(g=>g.v/base*100), backgroundColor:gs.map(g=>g.c), borderRadius:4, barPercentage:.82}]},
    options:{responsive:true, maintainAspectRatio:false, indexAxis: opts.horizontal?'y':'x',
      plugins:{legend:{display:false}, tooltip:{callbacks:{title:c=>c[0].label, label:c=>` ${c.raw.toFixed(1)}% · ${fmt$(gs[c.dataIndex].v)}`}}},
      scales:ejes(opts.horizontal, v=>v+'%', opts.rotate)}});
}
function barras$(id, labels, values, colors, opts={}){
  const el = document.getElementById(id); if(!el) return; if(CHARTS[id]) CHARTS[id].destroy();
  CHARTS[id] = new Chart(el, {type:'bar',
    data:{labels, datasets:[{data:values, backgroundColor:colors, borderRadius:4, barPercentage:.82}]},
    options:{responsive:true, maintainAspectRatio:false, indexAxis: opts.horizontal?'y':'x',
      plugins:{legend:{display:false}, tooltip:{callbacks:{title:c=>c[0].label, label:c=>` ${fmt$(c.raw)} · ${fmtP(c.raw/TOTAL)} de la cartera`}}},
      scales:ejes(opts.horizontal, v=>fmtM(v), opts.rotate)}});
}

/* ============ graficos a eleccion ============
   viz(id, gs, base, {label, tipos, def, alto}) devuelve {btns, body}; dibujarVistas() los dibuja con el tipo elegido */
const VIZ = {};
const VIZ_TXT = {donut:'Torta', hbar:'Barras', vbar:'Columnas', tabla:'Tabla'};
let PREF = {}; try { PREF = JSON.parse(localStorage.getItem('lt_viz')||'{}'); } catch(e) {}
function viz(id, gs, base, o={}){
  const tipos = o.tipos || ['donut','hbar','vbar','tabla'];
  VIZ[id] = {gs, base, label:o.label||'Categor&iacute;a', tipos, alto:o.alto, tipo: tipos.includes(PREF[id]) ? PREF[id] : (o.def || tipos[0])};
  return {btns:`<div class="vizsel" id="${id}-sel">${tipos.map(t=>`<button data-t="${t}" onclick="setViz('${id}','${t}')">${VIZ_TXT[t]}</button>`).join('')}</div>`,
          body:`<div id="${id}-wrap"></div>`};
}
function setViz(id, t){ VIZ[id].tipo = t; PREF[id] = t; try { localStorage.setItem('lt_viz', JSON.stringify(PREF)); } catch(e) {} dibujar(id); }
function dibujar(id){
  const V = VIZ[id], wrap = document.getElementById(id+'-wrap'); if(!wrap) return;
  document.querySelectorAll(`#${id}-sel button`).forEach(b=>b.classList.toggle('on', b.dataset.t===V.tipo));
  if(CHARTS[id]){ CHARTS[id].destroy(); delete CHARTS[id]; }
  const alto = V.tipo==='hbar' ? Math.max(220, V.gs.length*30+40) : (V.alto||290);
  if(V.tipo==='tabla'){ wrap.innerHTML = tabla(V.gs, V.base, V.label); return; }
  if(V.tipo==='donut'){
    wrap.innerHTML = `<div class="split"><div class="chart-box" style="height:${alto}px"><canvas id="${id}"></canvas></div><div>${leyenda(V.gs, V.base)}</div></div>`;
    donut(id, V.gs); return; }
  wrap.innerHTML = `<div class="chart-box" style="height:${alto}px"><canvas id="${id}"></canvas></div>`;
  barrasP(id, V.gs, V.base, {horizontal:V.tipo==='hbar', rotate:V.tipo==='vbar' && V.gs.length>5 && Math.max(...V.gs.map(g=>g.k.length))>8 ? 35 : 0});
}
function dibujarVistas(){ Object.keys(VIZ).forEach(id=>{ if(document.getElementById(id+'-wrap')) dibujar(id); }); }
/* tarjeta estandar con grafico a eleccion */
function cardViz(id, titulo, meta, gs, base, o={}){
  const v = viz(id, gs, base, o);
  return `<div class="card"><div class="card-title"><span>${titulo}${meta?` <span class="meta">${meta}</span>`:''}</span>${v.btns}</div>${v.body}${o.pie||''}</div>`;
}

/* ============ bloques reutilizables ============ */
function leyenda(gs, base){
  return `<div class="legend">` + gs.map(g=>`<div class="li"><span class="dot" style="background:${g.c}"></span>
    <span class="nm">${esc(g.k)}</span><span class="vl">${fmt$(g.v)}</span><span class="pc">${fmtP(g.v/base)}</span></div>`).join('') + `</div>`;
}
function tabla(gs, base, label){
  if(!gs.length) return '<div class="muted">Sin exposici&oacute;n.</div>';
  const mx = Math.max(...gs.map(g=>g.v));
  return `<table><thead><tr><th>${label}</th><th class="num">Valor</th><th class="num">%</th><th style="width:130px"></th></tr></thead><tbody>` +
    gs.map(g=>`<tr><td><span class="dot" style="background:${g.c}"></span>${esc(g.k)}</td><td class="num">${fmt$(g.v)}</td>
      <td class="num">${fmtP(g.v/base)}</td><td><div class="bar"><div style="width:${(g.v/mx*100).toFixed(1)}%;background:${g.c}"></div></div></td></tr>`).join('') +
    `<tr class="total"><td>Total</td><td class="num">${fmt$(base)}</td><td class="num">100.0%</td><td></td></tr></tbody></table>`;
}

const gRat = r => grupos(RAT, r.rat, RAT_COLORS);

const gi = (arr, keys) => keys.reduce((s,k)=>s+arr[GEO.indexOf(k)],0);
const DESARR = ['Reino Unido','Europa desarrollada','Australasia','Japón','Asia desarrollada'];
const EMERG = ['Latinoamérica','Europa emergente','Medio Oriente y África','China','Asia emergente','Otros'];
/* allocation detallado: RF abierta por calidad (escalada al monto RF de la clase), RV por region */
function gDet(r){
  const rfTot = r.c('Renta Fija'), k = r.rfv ? rfTot/r.rfv : 0;
  return [
    {k:'Liquidez', v:r.c('Liquidez'), c:'#0e7490'},
    {k:'RF Investment Grade', v:sum(r.rat.slice(0,4))*k, c:'#1e3a8a'},
    {k:'RF High Yield', v:sum(r.rat.slice(4,7))*k, c:'#60a5fa'},
    {k:'RF sin rating', v:r.rat[7]*k, c:'#bfdbfe'},
    {k:'RV Norteamérica', v:gi(r.rvgeo,['Norteamérica']), c:'#0a6b3b'},
    {k:'RV Desarrollados ex-NA', v:gi(r.rvgeo,DESARR), c:'#4d7c0f'},

    {k:'Oro / Commodities', v:r.c('Oro / Commodities'), c:'#b45309'},
    {k:'Otros', v:r.c('Otros')+r.c('Derivados'), c:'#94a3b8'},
  ].filter(g=>g.v>0.5);
}

  document.getElementById('view-posiciones').innerHTML = `
    <div class="card"><div class="card-title">Detalle de posiciones con su look-through <span class="meta">${POS.length} l&iacute;neas de los statements</span></div>

        <span class="lblf">Fuente</span><select class="filter" id="fPosMatch" onchange="filtrarPos()"><option value="">Todas</option><option value="directo">MaximUs</option><option value="proxy">Proxy</option><option value="supuesto">Supuesto</option><option value="liquidez">Efectivo</option></select>
        <span class="lblf" id="posCount"></span><button class="btn-csv" id="btnCopiar" onclick="copiarTabla()">Copiar tabla</button></div>
      <textarea id="copiaTxt" hidden readonly aria-label="Tabla para copiar" style="width:100%;height:120px;margin-bottom:12px;font-size:11px"></textarea>
      <div class="tbl-wrap"><table><thead><tr>${COLS_POS.map(([k,t,n])=>`<th class="sortable ${n?'num':''}" onclick="ordenarPos('${k}')">${t}<span class="sarr" data-k="${k}"></span></th>`).join('')}
        <th>Fuente</th><th>Activo MaximUs usado</th></tr></thead><tbody id="tbPos"></tbody></table></div></div>`;
  filtrarPos();
}
const COLS_POS = [['nombre','Activo',0],['cuenta','Cuenta',0],['valor','Valor',1],['pct','% cartera',1],['liq','Liq.',1],['rf','RF',1],['rv','RV',1],['oro','Oro',1],['otros','Otros',1],['dur','Dur.',1],['ytw','YTW',1]];
const valPos = (p,k) => ({nombre:p.nombre, cuenta:p.cuenta, valor:p.valor, pct:p.valor, liq:p.lt.cl[0], rf:p.lt.cl[1], rv:p.lt.cl[2], oro:p.lt.cl[3],
  otros:p.lt.cl[4]+p.lt.cl[5], dur:p.lt.dur, ytw:p.lt.ytw})[k];
let SORT_POS = {k:'valor', d:-1};
function ordenarPos(k){ SORT_POS = {k, d: SORT_POS.k===k ? -SORT_POS.d : (k==='nombre'||k==='cuenta'?1:-1)}; filtrarPos(); }
function filasPos(){
  const q = (document.getElementById('qPos')?.value||'').toLowerCase();
  const fb = document.getElementById('fPosBanco')?.value||'', fm = document.getElementById('fPosMatch')?.value||'';
  return POS.filter(p=>(!q || p.nombre.toLowerCase().includes(q) || (p.isin||'').toLowerCase().includes(q)) && (!fb||p.cuenta===fb) && (!fm||p.match===fm))
    .slice().sort((a,b)=>{ const x=valPos(a,SORT_POS.k), y=valPos(b,SORT_POS.k);
      if(x==null) return 1; if(y==null) return -1;
      return (typeof x==='number' ? x-y : String(x).localeCompare(String(y)))*SORT_POS.d; });
}
/* copia la tabla filtrada como texto separado por tabulaciones: se pega directo en Excel */
function copiarTabla(){
  const rows = filasPos(), n = v => v==null ? '' : String(Math.round(v*100)/100).replace('.',',');
  const head = ['Cuenta','Activo','ISIN/CUSIP','Valor USD','% cartera','% Liquidez','% Renta Fija','% Renta Variable','% Oro','% Otros','Duración','YTW','Fuente','Activo MaximUs usado','Nota'];
  const body = rows.map(p=>[p.cuenta, p.nombre, p.isin||'', n(p.valor), n(p.valor/TOTAL*100), n(p.lt.cl[0]), n(p.lt.cl[1]), n(p.lt.cl[2]), n(p.lt.cl[3]),
    n(p.lt.cl[4]+p.lt.cl[5]), n(p.lt.dur), n(p.lt.ytw), MATCH_TXT[p.match], p.mxname||'', p.nota||''].map(x=>String(x).replace(/[\t\n]/g,' ')).join('\t'));
  const txt = [head.join('\t'), ...body].join('\n');
  const btn = document.getElementById('btnCopiar'), ok = m => { btn.textContent = m; setTimeout(()=>btn.textContent='Copiar tabla', 2200); };
  const fallback = () => { const ta = document.getElementById('copiaTxt'); ta.hidden = false; ta.value = txt; ta.select(); ok('Seleccioná y copiá (Ctrl+C)'); };
  try { navigator.clipboard.writeText(txt).then(()=>ok(`Copiadas ${rows.length} filas`), fallback); } catch(e) { fallback(); }
}
function filtrarPos(){
  const rows = filasPos();
  document.querySelectorAll('.sarr').forEach(s=>s.textContent = s.dataset.k===SORT_POS.k ? (SORT_POS.d>0?' ▲':' ▼') : '');
  document.getElementById('tbPos').innerHTML = rows.map(p=>{const L=p.lt; return `<tr>
    <td>${esc(p.nombre.slice(0,72))}<div class="muted" style="font-size:10.5px">${esc(p.isin||'')}</div></td>
    <td><span class="dot" style="background:${bancoColor(p.cuenta)}"></span>${esc(p.cuenta)}</td>
    <td class="num"><strong>${fmt$(p.valor)}</strong></td><td class="num muted">${fmtP(p.valor/TOTAL,2)}</td>
    ${[0,1,2,3].map(i=>`<td class="num">${pctLT(L,i)}</td>`).join('')}
    <td class="num">${L.cl[4]+L.cl[5]>0.5?(L.cl[4]+L.cl[5]).toFixed(0)+'%':'<span class="muted">—</span>'}</td>
    <td class="num muted">${L.dur==null?'—':fmtN(L.dur,2)}</td><td class="num muted">${L.ytw==null?'—':fmtN(L.ytw,2)+'%'}</td>
    <td>${tagFuente(p)}</td><td style="font-size:11px">${esc(p.mxname||'—')}${p.nota?`<div class="muted" style="font-size:10.5px">${esc(p.nota)}</div>`:''}</td></tr>`;}).join('');
  document.getElementById('posCount').textContent = `${rows.length} posiciones · ${fmt$(sum(rows.map(p=>p.valor)))}`;
}

      ${r.rfv?`<div class="kpi"><div class="lbl">Renta fija</div><div class="val">${fmtN(r.dur,2)} &middot; ${fmtN(r.ytw,2)}%</div><div class="sub">duraci&oacute;n &middot; YTW &middot; rating ${ratingDe(r.ratNum)}</div></div>`:''}
    </div>
    <div class="grid2">
      ${cardViz('vBcoCl', 'Clase de activo look-through', '', gCl(r), r.total, {label:'Clase de activo'})}
      ${cardViz('vBcoDet', 'Allocation detallado', '', gDet(r), r.total, {label:'Segmento', def:'hbar'})}
    </div>
    <div class="grid2">
      ${r.rfv?cardViz('vBcoRat', 'Calidad crediticia de la renta fija', '', gRat(r), r.rfv, {label:'Rating', def:'vbar'}):''}
      ${r.rfv?cardViz('vBcoRfGeo', 'Renta fija por regi&oacute;n', '', gRfGeo(r), r.rfv, {label:'Regi&oacute;n', def:'hbar'}):''}
    </div>
    ${r.rvv?`<div class="grid2">
      ${cardViz('vBcoRvGeo', 'Renta variable por regi&oacute;n', '', gRvGeo(r), r.rvv, {label:'Regi&oacute;n', def:'hbar'})}
      ${cardViz('vBcoRvSec', 'Renta variable por sector', '', gRvSec(r), r.rvv, {label:'Sector', def:'hbar'})}</div>`:''}
    <div class="card"><div class="card-title">Posiciones de ${esc(nombre)} <span class="meta">${items.length} l&iacute;neas</span></div>
      <div class="tbl-wrap"><table><thead><tr><th>Activo</th><th class="num">Valor</th><th class="num">% cuenta</th><th>Composici&oacute;n</th>
        <th class="num">Liq.</th><th class="num">RF</th><th class="num">RV</th><th class="num">Dur.</th><th class="num">YTW</th><th>Fuente</th></tr></thead><tbody>
      ${items.map(p=>`<tr><td>${esc(p.nombre.slice(0,72))}<div class="muted" style="font-size:10.5px">${esc(p.isin||'')}</div></td>
        <td class="num"><strong>${fmt$(p.valor)}</strong></td><td class="num">${fmtP(p.valor/c.total,2)}</td><td>${miniAA(p.lt)}</td>
        <td class="num">${pctLT(p.lt,0)}</td><td class="num">${pctLT(p.lt,1)}</td><td class="num">${pctLT(p.lt,2)}</td>
        <td class="num muted">${p.lt.dur==null?'—':fmtN(p.lt.dur,2)}</td><td class="num muted">${p.lt.ytw==null?'—':fmtN(p.lt.ytw,2)+'%'}</td><td>${tagFuente(p)}</td></tr>`).join('')}
      <tr class="total"><td>Total ${esc(nombre)}</td><td class="num">${fmt$(c.total)}</td><td class="num">100.0%</td><td></td>
        <td class="num">${fmtP(r.c('Liquidez')/r.total,0)}</td><td class="num">${fmtP(r.c('Renta Fija')/r.total,0)}</td><td class="num">${fmtP(r.c('Renta Variable')/r.total,0)}</td>
        <td class="num">${fmtN(r.dur,2)}</td><td class="num">${r.ytw==null?'—':fmtN(r.ytw,2)+'%'}</td><td></td></tr>
      </tbody></table></div>
      <div class="note">Total informado por el custodio: <strong>${fmt$(c.total_reportado,2)}</strong>. Suma de posiciones: <strong>${fmt$(c.total,2)}</strong>.
        ${Math.abs(c.total-c.total_reportado)<0.5?'Cuadra exactamente.':'<span style="color:var(--red)">Existe una diferencia a revisar.</span>'}
        ${nombre==='Balanz'?' Incluye la cuenta local (Balanz Capital Valores) y la internacional (Balanz Capital International). El PIMCO Income viene en una sola l&iacute;nea en la planilla de Balanz: la clase E Dist se val&uacute;a a mercado (748,57 cuotapartes &times; USD 8,93) y el resto corresponde a la clase E Acc.':''}</div></div>`;
  dibujarVistas();
}

/* ============ navegacion ============ */
const TITULOS = {
  general:['CONSOLIDADO LOOK-THROUGH · TODAS LAS CUENTAS','Dashboard General'],
  allocation:['CONSOLIDADO LOOK-THROUGH · DISTRIBUCIÓN','Asset Allocation'],
  rentafija:['CONSOLIDADO LOOK-THROUGH · RENTA FIJA','Renta Fija'],
  rentavariable:['CONSOLIDADO LOOK-THROUGH · RENTA VARIABLE','Renta Variable'],
  vehiculos:['CONSOLIDADO LOOK-THROUGH · GESTIÓN DELEGADA','Fondos y ETFs'],
  concentracion:['CONSOLIDADO · RIESGO DE CONCENTRACIÓN','Concentración'],
  posiciones:['CONSOLIDADO LOOK-THROUGH · DETALLE','Posiciones'],
};
const RENDER = {general:renderGeneral, allocation:renderAllocation, rentafija:renderRentaFija, rentavariable:renderRentaVariable,
  vehiculos:renderVehiculos, concentracion:renderConcentracion, posiciones:renderPosiciones};
const HECHAS = new Set();
function mostrar(v, banco){
  document.querySelectorAll('.view').forEach(e=>e.classList.remove('active'));
  document.querySelectorAll('.sb-item').forEach(e=>e.classList.remove('active'));
  if(v==='banco'){
    document.getElementById('view-banco').classList.add('active');
    document.querySelector(`.sb-item[data-banco="${banco}"]`)?.classList.add('active');
    document.getElementById('mhTag').textContent = 'CUENTA INDIVIDUAL · LOOK-THROUGH';
    document.getElementById('mhH1').innerHTML = esc(banco) + ` <span class="badge">${fmtP(CUENTAS_ALL.find(c=>c.nombre===banco).total/TOTAL_ALL)} del total</span>`;
    renderBanco(banco);
  } else {
    document.getElementById('view-'+v).classList.add('active');
    document.querySelector(`.sb-item[data-view="${v}"]`)?.classList.add('active');
    document.getElementById('mhTag').textContent = TITULOS[v][0];
    document.getElementById('mhH1').innerHTML = TITULOS[v][1];
    if(!HECHAS.has(v)){ RENDER[v](); HECHAS.add(v); }
  }
  window.scrollTo(0,0);
}
function irBanco(n){ mostrar('banco', n); }

/* ============ filtro global por cuenta ============ */
let VISTA = 'general';
function setScope(s){
  SCOPE = s;
  POS = s ? POS_ALL.filter(p=>p.cuenta===s) : POS_ALL;
  CUENTAS = s ? CUENTAS_ALL.filter(c=>c.nombre===s) : CUENTAS_ALL;
  TOTAL = sum(POS.map(p=>p.valor)); LT = lt(POS);
  Object.keys(CHARTS).forEach(k=>{ CHARTS[k].destroy(); delete CHARTS[k]; });
  HECHAS.clear(); cabecera();
  mostrar(VISTA==='banco' ? 'general' : VISTA);
}
function cabecera(){
  document.getElementById('sbSub').textContent = `${CUENTAS.length} cuenta${CUENTAS.length>1?'s':''} · ${POS.length} posiciones`;
  document.getElementById('cntPos').textContent = POS.length;
  document.getElementById('sbFootTot').textContent = fmt$(TOTAL);
  document.getElementById('mhMeta').innerHTML = `<div style="font-size:17px;font-weight:800;color:var(--text)">${fmt$(TOTAL)}</div>
    <div>${SCOPE ? esc(SCOPE) : CUENTAS.length+' cuentas'} &middot; ${POS.length} posiciones &middot; al 30/09/2026</div>`;
}
const _mostrar = mostrar;
mostrar = function(v, banco){ VISTA = v; _mostrar(v, banco);
  if(v!=='banco' && SCOPE) document.getElementById('mhH1').innerHTML += ` <span class="badge">${esc(SCOPE)}</span>`; };

/* init */
document.getElementById('sbFoot').innerHTML = 'Composición al 30/09/2026<br>Look-through con datos de MaximUs';
document.getElementById('sbScope').innerHTML = `<option value="">Todas las cuentas</option>` + CUENTAS_ALL.map(c=>`<option>${esc(c.nombre)}</option>`).join('');
document.getElementById('sbBancos').innerHTML = CUENTAS_ALL.map(c=>`
  <div class="sb-item" data-banco="${esc(c.nombre)}" onclick="irBanco('${esc(c.nombre)}')">
    <span class="cdot" style="background:${bancoColor(c.nombre)}"></span> ${esc(c.nombre)}
    <span class="count">${fmtP(c.total/TOTAL_ALL,0)}</span></div>`).join('');
document.querySelectorAll('.sb-item[data-view]').forEach(el=>el.addEventListener('click', ()=>mostrar(el.dataset.view)));
cabecera();
mostrar('general');


</script>
</body>
